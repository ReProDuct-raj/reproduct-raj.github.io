name: Fetch Private MD and Deploy Pages

on:
  push:
    branches: [ "main" ] # Triggers build when you update the Pages repo
  workflow_dispatch:     # Allows you to manually trigger a sync via the UI button

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the current Public GitHub Pages repository
      - name: Checkout Public Pages Repo
        uses: actions/checkout@v4
        with:
          path: main-site

      # 2. Securely pull the private repository using your PAT token
      - name: Checkout Private MD Repo
        uses: actions/checkout@v4
        with:
          repository: ReProDuct-raj/PreparationFlutterPackagesAndIMPL
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-docs

      # 3. Process the files, move them into flutterPreparation, and create an index catalog
      # এখানে পাথ পরিবর্তন করে main-site/flutterPreparation/docs/ করা হয়েছে
      - name: Setup and Move Files
        run: |
          # Create the docs sub-folder inside flutterPreparation structure
          mkdir -p main-site/flutterPreparation/docs/
          
          # Copy the .md files out of the secure private temporary directory
          cp -r private-docs/. main-site/flutterPreparation/docs/

          # DYNAMIC GENERATION: Find all .md files and build a JSON list for JavaScript
          cd main-site/flutterPreparation/docs
          find . -name "*.md" | sed 's|^\./||' | jq -R -s 'split("\n") | map(select(length > 0))' > files-index.json

      # 4. Upload Finished Site Artifact
      # সম্পূর্ণ main-site ফোল্ডার আপলোড হবে যাতে flutterPreparation ফোল্ডারটি অক্ষুণ্ণ থাকে
      - name: Upload Finished Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: main-site

      # 5. Push the build results live to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
