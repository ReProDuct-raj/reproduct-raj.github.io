<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation Portal</title>
    <!-- Fixed: Added correct and working CDN link for Marked.js library -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --sidebar-width: 280px;
            --border-color: #e1e4e6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            color: #24292e;
        }
        #sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            border-right: 1px solid var(--border-color);
            background: var(--bg-color);
            position: fixed;
            overflow-y: auto;
            padding: 20px 10px;
            box-sizing: border-box;
        }
        #sidebar h3 {
            margin-left: 10px;
            font-size: 16px;
            color: #586069;
        }
        #sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #sidebar li a {
            display: block;
            padding: 8px 10px;
            color: #0366d6;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #sidebar li a:hover {
            background-color: #0366d610;
        }
        #sidebar li a.active {
            background-color: #0366d6;
            color: white;
            font-weight: 600;
        }
        #content-wrapper {
            margin-left: var(--sidebar-width);
            padding: 40px;
            max-width: 850px;
            width: 100%;
            box-sizing: border-box;
        }
        .markdown-body img {
            max-width: 100%;
        }
        .markdown-body pre {
            background-color: #f6f8fa;
            padding: 16px;
            border-radius: 6px;
            overflow: auto;
        }
    </style>
</head>
<body>

    <!-- Dynamic File Navigation Menu -->
    <nav id="sidebar">
        <h3>Files</h3>
        <ul id="file-list"><li>Loading file indexes...</li></ul>
    </nav>

    <!-- Main Content Reader Viewport -->
    <main id="content-wrapper">
        <article id="view" class="markdown-body">Select a file from the sidebar menu to begin reading.</article>
    </main>

    <script>
        const fileListContainer = document.getElementById('file-list');
        const contentViewport = document.getElementById('view');

        // Fetch markdown assets and convert to semantic HTML elements
        function loadMarkdownFile(fileName, linkElement) {
            contentViewport.innerHTML = "Rendering content...";
            
            // Highlight current active link state
            document.querySelectorAll('#file-list a').forEach(el => el.classList.remove('active'));
            if(linkElement) linkElement.classList.add('active');

            fetch(`./docs/${fileName}`)
                .then(res => {
                    if (!res.ok) throw new Error("File fetch failure");
                    return res.text();
                })
                .then(markdownRaw => {
                    // Fixed: Uses the properly loaded marked library instance
                    contentViewport.innerHTML = marked.parse(markdownRaw);
                })
                .catch(err => {
                    contentViewport.innerHTML = `<h3>Error</h3><p>Could not compile ${fileName}.</p>`;
                    console.error(err);
                });
        }

        // Initialize portal layout by parsing the index catalog
        fetch('./docs/files-index.json')
            .then(res => {
                if (!res.ok) throw new Error("Index file fetch failure");
                return res.json();
            })
            .then(filesArray => {
                if (!filesArray || filesArray.length === 0) {
                    fileListContainer.innerHTML = "<li>No files found.</li>";
                    return;
                }
                
                fileListContainer.innerHTML = ""; // Clear loader message
                
                filesArray.forEach((file, index) => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = "#";
                    a.textContent = file.replace(/\.md$/i, ''); // Strip extensions for display
                    a.title = file;
                    
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        loadMarkdownFile(file, a);
                    });
                    
                    li.appendChild(a);
                    fileListContainer.appendChild(li);

                    // Automatically load the first document on init
                    if (index === 0) loadMarkdownFile(file, a);
                });
            })
            .catch(err => {
                fileListContainer.innerHTML = "<li>Error cataloging folder assets.</li>";
                console.error("Index loading error:", err);
            });
    </script>
</body>
</html>
